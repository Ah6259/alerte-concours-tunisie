# Robot quotidien d'Alerte Concours Tunisie — tourne sur GitHub, sans PC.
# Lecture du tableau officiel des concours -> pages du site -> tests -> enregistrement (GitHub Pages republie tout seul).
# Le site n'est enregistré que si TOUS les tests passent (sinon GitHub prévient et l'ancien site reste en ligne).
# Si le portail est en panne, l'ancien fichier est gardé (le robot sort en erreur et GitHub prévient).
name: maj
on:
  schedule:
    - cron: "20 5 * * *"       # 6h20 heure de Tunis
  workflow_dispatch:
concurrency:
  group: maj-site
  cancel-in-progress: false
permissions:
  contents: write
env:
  TZ: Africa/Tunis
  PYTHONIOENCODING: utf-8
jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Test du robot (sans réseau)
        run: python tools/test_robot.py
      - name: Lecture du tableau officiel des concours
        run: python robot/lire_concours.py
      - name: Lecture des actualités du portail (résultats, convocations…) — une panne ne bloque pas le site
        run: python robot/lire_actualites.py
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Pages du site
        run: python robot/construire_site.py
      - name: Tests du site (rien n'est publié si un test échoue)
        run: |
          npm install --no-save --no-package-lock jsdom
          node tools/test_site.mjs
      - name: Enregistrer
        run: |
          git config user.name "robot-concours"
          git config user.email "robot-concours@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Concours du $(date +%d/%m/%Y)"
          git pull --rebase -q && git push -q
