# Essai (manuel) : GitHub peut-il lire le site de l'ANETI ? Enregistre la liste des concours et un détail dans tools/exemples/
# pour écrire le lecteur (le site de l'ANETI ne répond pas depuis l'ordinateur de Claude). À supprimer après usage.
name: essai-aneti
on: workflow_dispatch
permissions:
  contents: write
jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Lire l'ANETI
        run: |
          A="alerte-concours-tunisie/1.0 (site gratuit d'information ; robot lent)"
          mkdir -p tools/exemples
          for u in "https://www.emploi.nat.tn/fo/Fr/global.php?page=21" "http://www.emploi.nat.tn/fo/Fr/global.php?page=21"; do
            if curl -sS -L -m 60 -A "$A" "$u" -o tools/exemples/aneti-liste.html; then echo "OK $u"; break; else echo "échec $u"; fi
          done
          ls -la tools/exemples/
          REF=$(grep -o 'page=198&amp;ref=[0-9]*\|page=198&ref=[0-9]*' tools/exemples/aneti-liste.html | head -1 | grep -o '[0-9]*$')
          echo "ref=$REF"
          if [ -n "$REF" ]; then sleep 3; curl -sS -L -m 60 -A "$A" "https://www.emploi.nat.tn/fo/Fr/global.php?page=198&ref=$REF" -o tools/exemples/aneti-detail.html || true; fi
      - name: Enregistrer
        run: |
          git config user.name "robot-concours"; git config user.email "robot-concours@users.noreply.github.com"
          git add tools/exemples/aneti-*.html 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Essai ANETI : pages enregistrées pour écrire le lecteur"
          git pull --rebase -q && git push -q
