# À chaque envoi : test du robot (sans réseau). En cas d'échec, GitHub prévient.
name: Tests
on:
  push:
    branches: [main, "entretien-tests/**"]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/test_robot.py
        env: { PYTHONIOENCODING: utf-8 }
